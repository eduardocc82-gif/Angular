<div class="filter-bar finance-card">
  <div class="filter-bar__controls">
    <label class="filter-bar__field filter-bar__field--month">
      <span class="filter-bar__label">
        <i class="bi bi-calendar3"></i>
        Mês de análise
      </span>
      <select
        class="form-select"
        [ngModel]="filters.month"
        (ngModelChange)="updateFilter('month', $event)"
      >
        <option value="todos">Todos os meses</option>
        <option *ngFor="let month of months" [value]="month">{{ monthLabel(month) }}</option>
      </select>
      <small>Escolha outro mês para mudar a análise.</small>
    </label>

    <label class="filter-bar__field">
      <span class="filter-bar__label">
        <i class="bi bi-tags"></i>
        Categoria
      </span>
      <select
        class="form-select"
        [ngModel]="filters.category"
        (ngModelChange)="updateFilter('category', $event)"
      >
        <option value="todas">Todas as categorias</option>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </label>

    <label *ngIf="showTypeFilter" class="filter-bar__field">
      <span class="filter-bar__label">
        <i class="bi bi-funnel"></i>
        Tipo
      </span>
      <select
        class="form-select"
        [ngModel]="filters.type"
        (ngModelChange)="updateFilter('type', $event)"
      >
        <option value="todos">Todos os tipos</option>
        <option value="entrada">Entradas</option>
        <option value="saida">Saídas</option>
        <option value="investimento">Investimentos</option>
      </select>
    </label>
  </div>
</div>
