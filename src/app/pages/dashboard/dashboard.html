<!-- Dashboard principal com cards, meta, filtros, tabela e gráficos. -->
<section class="page-shell dashboard-page">
  <div class="dashboard-page__hero">
    <h1 class="dashboard-page__month-title">{{ analysisMonthLabel }}</h1>
    <a class="btn btn-dark" routerLink="/lancamentos">
      <i class="bi bi-plus-circle"></i>
      Novo lançamento
    </a>
  </div>

  <!-- Cards de resumo em flex responsivo como pedido nas especificações. -->
  <div class="dashboard-page__cards">
    <app-summary-card
      title="Total de Entradas"
      [value]="summary.entradas"
      helper="Receitas no período"
      icon="bi-graph-up-arrow"
      tone="green"
    ></app-summary-card>
    <app-summary-card
      title="Total de Saídas"
      [value]="summary.saidas"
      helper="Despesas no período"
      icon="bi-graph-down-arrow"
      tone="red"
    ></app-summary-card>
    <app-summary-card
      title="Saldo Mensal"
      [value]="summary.saldo"
      helper="Entradas menos saídas"
      icon="bi-wallet2"
      tone="blue"
    ></app-summary-card>
    <app-summary-card
      title="Investimentos"
      [value]="summary.investimentos"
      helper="Aportes registrados"
      icon="bi-graph-up-arrow"
      tone="yellow"
    ></app-summary-card>
    <app-summary-card
      title="Saldo hoje carteira"
      [value]="walletBalanceToday"
      helper="Entradas - despesas até hoje"
      icon="bi-cash-coin"
      [tone]="walletBalanceTone"
    ></app-summary-card>
  </div>

  <h2 class="dashboard-page__profiles-title">Escolha sua meta</h2>

  <div class="dashboard-page__profiles">
    <button
      *ngFor="let profile of profiles"
      type="button"
      class="finance-card dashboard-page__profile"
      [class.dashboard-page__profile--active]="profile.id === selectedProfileId"
      (click)="selectProfile(profile.id)"
    >
      <strong>{{ profile.label }}</strong>
      <span>{{ profile.percentage }}% das entradas</span>
      <small>{{ profile.description }}</small>
    </button>
  </div>

  <app-goal-projection [profile]="selectedProfile" [projection]="projection"></app-goal-projection>

  <app-expense-balance [balance]="expenseBalance"></app-expense-balance>

  <app-chart-panel
    class="dashboard-page__cashflow"
    [title]="cashFlowTitle"
    mode="cashflow"
    [records]="records"
    [monthKey]="cashFlowMonth"
  ></app-chart-panel>

  <app-filter-bar
    [months]="months"
    [categories]="categories"
    [filters]="filters"
    (filtersChange)="updateFilters($event)"
  ></app-filter-bar>

  <app-records-table
    title="Lançamentos do período"
    [records]="filteredRecords"
    (deleteRecord)="deleteRecord($event)"
  ></app-records-table>

  <div class="dashboard-page__charts">
    <app-chart-panel
      title="Despesas por categoria"
      mode="category"
      [records]="filteredRecords"
    ></app-chart-panel>
    <div class="dashboard-page__annual-stack">
      <app-chart-panel
        title="Evolução mensal - Entradas vs Saídas"
        mode="monthly"
        [records]="records"
      ></app-chart-panel>
      <app-chart-panel
        title="Saldo acumulado anual"
        mode="closingBalance"
        [records]="records"
      ></app-chart-panel>
    </div>
  </div>
</section>
