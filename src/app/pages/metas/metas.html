<!-- Página dedicada a metas e perfis financeiros. -->
<section class="page-shell metas-page">
  <div>
    <h1 class="page-title">Metas de gastos</h1>
    <p class="page-subtitle">Compare seu consumo mensal com o perfil financeiro selecionado.</p>
  </div>

  <div class="metas-page__profiles">
    <button
      *ngFor="let profile of profiles"
      type="button"
      class="finance-card metas-page__profile"
      [class.metas-page__profile--active]="profile.id === selectedProfileId"
      (click)="selectProfile(profile.id)"
    >
      <strong>{{ profile.label }}</strong>
      <span>{{ profile.percentage }}% das entradas</span>
      <small>{{ profile.description }}</small>
    </button>
  </div>

  <app-goal-projection [profile]="selectedProfile" [projection]="projection"></app-goal-projection>
</section>
